    <sc-for list="{{foods}}" as="f" hint-placeholder-count="5">
      <button onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="display: flex; align-items: center; gap: 24px; height: 104px; padding: 0 32px; border-radius: 20px; cursor: pointer; text-align: left; font-family: 'IBM Plex Sans', sans-serif; background: {{f.bg}}; border: 2px solid {{f.line}}; color: #E8F1F5">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; color: #9DB4C2; width: 64px">{{f.code}}</span>
        <span style="flex: 1; font-size: 32px; font-weight: 500">{{f.name}}</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 26px; color: {{f.snpColor}}">{{f.snpLabel}}</span>
      </button>
    </sc-for>
  </div>

  <sc-if value="{{isMatch}}" hint-placeholder-val="{{ true }}">
    <div style="margin-top: 36px; padding: 32px; border-radius: 20px; background: #12283A; border: 1px solid #1F3A4F; display: flex; flex-direction: column; gap: 20px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; color: #9DB4C2; letter-spacing: 0.1em">ALL 14 PATIENTS vs SAMPLE F2</span>
      <div style="display: flex; gap: 8px" aria-hidden="true">
        <sc-for list="{{cluster}}" as="p" hint-placeholder-count="14">
          <span style="flex: 1; height: 56px; border-radius: 8px; background: {{p.bg}}"></span>
        </sc-for>
      </div>
      <span style="font-size: 28px; line-height: 1.4; color: #DCE8EE"><b style="font-weight: 600; color: {{accent}}">12 of 14</b> patient genomes sit within 5 SNPs of the sesame paste. The other 2 are unrelated cases.</span>
    </div>
  </sc-if>

  <div style="flex-grow: 1"></div>

  <a href="Solved.dc.html" style="display: flex; align-items: center; justify-content: center; height: 128px; border-radius: 64px; background: {{accent}}; color: #06141C; text-decoration: none; font-size: 40px; font-weight: 600">Confirm the source</a>
</div>
</script><script type="text/x-template" id="tpl-Solved">
<div style="width: 1080px; height: 1920px; box-sizing: border-box; background: #0A1A24; color: #E8F1F5; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; padding: 80px 88px 72px">

  <div style="display: flex; justify-content: space-between; align-items: center; font-family: 'IBM Plex Mono', monospace; font-size: 22px; letter-spacing: 0.12em; color: #9DB4C2">
    <span>STEP 5 OF 5 · CASE SOLVED</span>
    <div style="display: flex; gap: 10px" aria-hidden="true">
      <span style="width: 48px; height: 6px; border-radius: 3px; background: {{accent}}"></span>
      <span style="width: 48px; height: 6px; border-radius: 3px; background: {{accent}}"></span>
      <span style="width: 48px; height: 6px; border-radius: 3px; background: {{accent}}"></span>
      <span style="width: 48px; height: 6px; border-radius: 3px; background: {{accent}}"></span>
      <span style="width: 48px; height: 6px; border-radius: 3px; background: {{accent}}"></span>
    </div>
  </div>

  <div style="margin-top: 64px; display: flex; align-items: center; gap: 20px; font-family: 'IBM Plex Mono', monospace; font-size: 26px; color: {{accent}}; letter-spacing: 0.08em">
    <svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"></circle><path d="M7.5 12.5l3 3 6-6.5"></path></svg>
    SOURCE IDENTIFIED
  </div>
  <h1 style="margin: 24px 0 0; font-size: 96px; line-height: 1.02; font-weight: 600; letter-spacing: -0.02em">Sesame paste</h1>
  <p style="margin: 24px 0 0; font-size: 34px; line-height: 1.45; color: #C7D7E0; font-weight: 300">Low-moisture foods like tahini can carry <i>Salmonella</i> for months. Cooking isn’t part of how it’s eaten, so nothing kills the bacteria before it reaches the plate.</p>

  <div style="margin-top: 52px; display: flex; flex-direction: column">
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
      <div style="display: flex; gap: 28px">
        <div style="display: flex; flex-direction: column; align-items: center; width: 24px">
          <span style="width: 24px; height: 24px; border-radius: 12px; background: {{accent}}; margin-top: 10px"></span>
          <sc-if value="{{s.hasLine}}" hint-placeholder-val="{{ true }}">
            <span style="width: 2px; flex-grow: 1; background: #2C5470"></span>
          </sc-if>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 6px; padding-bottom: 36px">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 20px; color: #9DB4C2; letter-spacing: 0.08em">{{s.when}}</span>
          <span style="font-size: 32px; font-weight: 500">{{s.title}}</span>
          <span style="font-size: 25px; line-height: 1.45; color: #9DB4C2">{{s.text}}</span>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="margin-top: 8px; padding: 36px 40px; border-radius: 24px; background: #0F2331; border: 1px solid #1F3A4F; display: flex; flex-direction: column; gap: 16px">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 20px; color: #9DB4C2; letter-spacing: 0.1em">IN THE REAL WORLD</span>
    <p style="margin: 0; font-size: 30px; line-height: 1.45; color: #E8F1F5">Public health labs in many countries upload pathogen genomes to shared databases. A strain found in one country can be matched to cases on another continent, often before anyone suspects a link.</p>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="display: flex; gap: 32px; align-items: center">
    <div style="width: 200px; height: 200px; flex-shrink: 0; border-radius: 16px; background: #E8F1F5; color: #0A1A24; display: flex; align-items: center; justify-content: center; text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 20px; padding: 16px; box-sizing: border-box">[QR CODE]</div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 32px; font-weight: 600">Take the case file with you</span>
      <span style="font-size: 25px; line-height: 1.45; color: #9DB4C2">Scan for the full story, sources and further reading on genomic surveillance.</span>
    </div>
  </div>

  <a href="Main.dc.html" style="margin-top: 40px; display: flex; align-items: center; justify-content: center; height: 128px; border-radius: 64px; border: 2px solid {{accent}}; color: {{accent}}; text-decoration: none; font-size: 38px; font-weight: 600">Start a new investigation</a>
</div>
</script>
<script>
const SCREENS = {};
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(patch) { this.state = Object.assign({}, this.state, patch); render(); }
  forceUpdate() { render(); }
}
</script>
<script>
SCREENS.Main = class extends DCLogic {
  renderVals() {
    const pts = [[210,230,22],[300,300,34],[260,410,18],[470,200,28],[520,330,40],[610,250,20],[700,320,26],[640,470,32],[430,520,22],[330,560,30],[560,590,18],[720,560,24],[190,500,26],[390,380,36]];
    return {
      accent: this.props.accent ?? '#4CC9F0',
      alert: this.props.alert ?? '#F4A259',
      alertSoft: 'rgba(244,162,89,0.35)',
      cases: pts.map(([x,y,ring]) => ({ x, y, ring }))
    };
  }
}
SCREENS.Cases = class extends DCLogic {
  renderVals() {
    const counts = [1, 2, 4, 3, 3, 1];
    const cities = ['Northport','Eastvale','Ridgeford','Coral Bay','Westmere','Harlow'];
    const raw = [[34,1],[7,2],[61,2],[28,3],[45,3],[72,3],[19,3],[52,4],[38,4],[5,4],[66,5],[41,5],[23,5],[57,6]];
    return {
      accent: this.props.accent ?? '#4CC9F0',
      alert: this.props.alert ?? '#F4A259',
      weeks: counts.map((n, i) => ({ n, label: i + 1, h: (n / 4 * 140) + 'px' })),
      cases: raw.map(([age, week], i) => ({ id: 'P-' + String(i + 1).padStart(2, '0'), city: cities[i % 6], age, week }))
    };
  }
}
SCREENS.Methods = class extends DCLogic {
  constructor(props) { super(props); this.state = { view: 'old' }; }
  renderVals() {
    const accent = this.props.accent ?? '#4CC9F0';
    const alert = this.props.alert ?? '#F4A259';
    const isOld = this.state.view === 'old';
    const common = [6, 14, 22, 31, 42, 55, 68, 80];
    const other = [9, 18, 27, 33, 47, 60, 72, 86];
    const mk = (arr) => arr.map((p, i) => ({ top: p + '%', o: i % 3 === 0 ? 1 : 0.7 }));
    const ref = 'ATGCCGTAGGCTTACGATCG';
    const variants = [
      { label: 'PATIENT P-03', alt: {} },
      { label: 'SAMPLE A', alt: {} },
      { label: 'SAMPLE B', alt: { 6: 'C', 13: 'T' } }
    ];
    const seqs = variants.map(v => ({
      label: v.label,
      bases: ref.split('').map((ch, i) => {
        const diff = v.alt[i] !== undefined;
        return { ch: diff ? v.alt[i] : ch, bg: diff ? alert : '#1A3446', fg: diff ? '#1A0F05' : '#DCE8EE' };
      })
    }));
    return {
      accent, alert, isOld, isNew: !isOld,
      showOld: () => this.setState({ view: 'old' }),
      showNew: () => this.setState({ view: 'new' }),
      oldBg: isOld ? accent : 'transparent', oldFg: isOld ? '#06141C' : '#C7D7E0',
      newBg: isOld ? 'transparent' : accent, newFg: isOld ? '#C7D7E0' : '#06141C',
      lanes: [
        { label: 'P-03', bands: mk(common) },
        { label: 'A', bands: mk(common) },
        { label: 'B', bands: mk(common) },
        { label: 'C', bands: mk(other) }
      ],
      seqs
    };
  }
}
SCREENS.Sequence = class extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#4CC9F0';
    const info = [
      ['Isolate', 'Grow the bacteria from the patient’s stool sample into a pure culture.'],
      ['Extract DNA', 'Break open the cells and purify the genetic material.'],
      ['Sequence', 'A sequencer reads millions of short DNA fragments at once.'],
      ['Assemble', 'Software stitches the fragments into one complete genome.']
    ];
    const stages = info.map(([title, text], i) => ({
      n: i + 1, title, text, hasLine: i < info.length - 1,
      dotBg: accent, dotFg: '#06141C', dotLine: accent
    }));
    const pal = ['#4CC9F0', '#B9A2F5', '#F4A259', '#5E7F95'];
    let seed = 7;
    const bars = Array.from({ length: 96 }, () => { seed = (seed * 37 + 11) % 101; return { c: pal[seed % 4] }; });
    return { accent, stages, bars };
  }
}
SCREENS.Match = class extends DCLogic {
  constructor(props) { super(props); this.state = { picked: 'F2' }; }
  renderVals() {
    const accent = this.props.accent ?? '#4CC9F0';
    const alert = this.props.alert ?? '#F4A259';
    const data = [
      { code: 'F1', name: 'Shell eggs', snps: 46 },
      { code: 'F2', name: 'Sesame paste (tahini)', snps: 3 },
      { code: 'F3', name: 'Alfalfa sprouts', snps: 212 },
      { code: 'F4', name: 'Raw chicken', snps: 389 },
      { code: 'F5', name: 'Cantaloupe', snps: 1140 }
    ];
    const fmt = (n) => n.toLocaleString('en-US');
    const judge = (n) => n <= 10
      ? { verdict: 'Close match', tagBg: accent, tagFg: '#06141C', numColor: accent, explain: 'Only a handful of differences. This strain and the patient’s almost certainly share a recent common source.' }
      : n <= 60
        ? { verdict: 'Related, not a match', tagBg: '#3A2A18', tagFg: '#F6C89A', numColor: '#F6C89A', explain: 'Same serovar, but too many differences to come from the same recent source. A near miss.' }
        : { verdict: 'Unrelated', tagBg: '#22405A', tagFg: '#DCE8EE', numColor: '#C7D7E0', explain: 'Hundreds of differences. These bacteria have been evolving apart for a long time.' };
    const cur = data.find(d => d.code === this.state.picked) || data[1];
    const sel = Object.assign({ code: cur.code, snpText: fmt(cur.snps) }, judge(cur.snps));
    const shown = Math.min(cur.snps, 40);
    const marks = Array.from({ length: shown }, (_, i) => ({ left: (((i * 61 + 17) % 97) + 1) + '%' }));
    const foods = data.map(d => {
      const on = d.code === cur.code;
      return {
        code: d.code, name: d.name, pressed: on ? 'true' : 'false',
        snpLabel: on ? fmt(d.snps) + ' SNPs' : 'Compare',
        snpColor: on ? accent : '#9DB4C2',
        bg: on ? '#12304A' : '#12283A', line: on ? accent : '#1F3A4F',
        pick: () => this.setState({ picked: d.code })
      };
    });
    const cluster = Array.from({ length: 14 }, (_, i) => ({ bg: (i === 6 || i === 11) ? '#2C4456' : accent }));
    return { accent, alert, sel, marks, foods, cluster, isMatch: cur.snps <= 10 };
  }
}
SCREENS.Solved = class extends DCLogic {
  renderVals() {
    const info = [
      ['DAY 0', 'Genomes match', 'Sample F2 falls within 5 SNPs of 12 patient genomes.'],
      ['DAY 2', 'Traceback', 'Purchase records lead to a single producer and three production lots.'],
      ['DAY 3', 'Recall issued', 'Affected lots are pulled from shelves and the public is warned.'],
      ['WEEK 3', 'Cases stop', 'No new matching cases appear. The outbreak is declared over.']
    ];
    return {
      accent: this.props.accent ?? '#4CC9F0',
      steps: info.map(([when, title, text], i) => ({ when, title, text, hasLine: i < info.length - 1 }))
    };
  }
}
</script>
<script>
(function () {
  const ORDER = ["Main","Cases","Methods","Sequence","Match","Solved"];
  const IDLE_MS = 90000;            // back to the first screen after 90 s without a touch
  const instances = {};
  let current = ORDER[0];
  let lastTouch = Date.now();
  const stage = document.getElementById('stage');
  const frame = document.getElementById('frame');
  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  const WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;

  function lookup(path, scope) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    return path.split('.').reduce((v, k) => (v == null ? undefined : v[k]), scope);
  }
  const interp = (s, scope) => s.replace(HOLE, (_, p) => { const v = lookup(p, scope); return v == null ? '' : String(v); });
  function renderChildren(src, dest, scope) { src.childNodes.forEach(n => renderNode(n, dest, scope)); }
  function renderNode(n, dest, scope) {
    if (n.nodeType === 3) { dest.appendChild(document.createTextNode(interp(n.nodeValue, scope))); return; }
    if (n.nodeType !== 1) return;
    const tag = n.localName;
    if (tag === 'sc-for') {
      const m = WHOLE.exec(n.getAttribute('list') || '');
      const list = m ? lookup(m[1], scope) : [];
      const as = n.getAttribute('as') || 'item';
      (list || []).forEach((item, i) => renderChildren(n, dest, Object.assign(Object.create(scope), { [as]: item, $index: i })));
      return;
    }
    if (tag === 'sc-if') {
      const m = WHOLE.exec(n.getAttribute('value') || '');
      if (m && lookup(m[1], scope)) renderChildren(n, dest, scope);
      return;
    }
    const el = n.cloneNode(false);
    for (const attr of Array.from(n.attributes)) {
      const name = attr.name;
      if (name.startsWith('hint-')) { el.removeAttribute(name); continue; }
      const whole = WHOLE.exec(attr.value);
      if (/^on/i.test(name)) {
        el.removeAttribute(name);
        const fn = whole ? lookup(whole[1], scope) : null;
        if (typeof fn === 'function') el.addEventListener(name.slice(2).toLowerCase(), fn);
        continue;
      }
      el.setAttribute(name, whole ? String(lookup(whole[1], scope) ?? '') : interp(attr.value, scope));
    }
    if (tag === 'a') {
      const href = el.getAttribute('href') || '';
      const mm = /^([A-Za-z0-9_-]+)\.dc\.html$/.exec(href);
      el.removeAttribute('href'); el.setAttribute('role', 'link'); el.setAttribute('tabindex', '0');
      if (mm) el.addEventListener('click', e => { e.preventDefault(); go(mm[1]); });
    }
    renderChildren(n, el, scope);
    dest.appendChild(el);
  }
  function instance(key) { if (!instances[key]) instances[key] = new SCREENS[key]({}); return instances[key]; }
  const tplCache = {};
  function getTpl(key) {
    if (!tplCache[key]) { const t = document.createElement('template'); t.innerHTML = document.getElementById('tpl-' + key).textContent; tplCache[key] = t; }
    return tplCache[key];
  }
  function render() {
    const tpl = getTpl(current);
    const frag = document.createDocumentFragment();
    renderChildren(tpl.content, frag, instance(current).renderVals());
    stage.replaceChildren(frag);
  }
  window.render = render;
  function go(key) {
    if (!SCREENS[key]) return;
    if (key === ORDER[0]) Object.keys(instances).forEach(k => delete instances[k]);
    current = key; render();
  }
  function fit() {
    const s = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
    frame.style.transform = 'scale(' + s + ') translate(-50%, -50%)';
  }
  // kiosk behaviour
  let dirty = false;
  const touched = () => { lastTouch = Date.now(); dirty = true; };
  ['pointerdown', 'keydown'].forEach(ev => window.addEventListener(ev, touched, { passive: true }));
  window.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', e => e.preventDefault());
  window.addEventListener('pointerdown', () => {
    const d = document.documentElement;
    if (!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen().catch(() => {});
  }, { once: true });
  setInterval(() => {
    if (dirty && Date.now() - lastTouch > IDLE_MS) { dirty = false; go(ORDER[0]); }
  }, 2000);
  window.addEventListener('resize', fit);
  const nojs = document.getElementById('nojs'); if (nojs) nojs.remove();
  fit(); render();
})();
</script>
</body>
